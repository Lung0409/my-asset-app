name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download TWSE data
        run: |
          curl -L --fail --retry 3 "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL" -o market.json
          curl -L --fail --retry 3 "https://openapi.twse.com.tw/v1/opendata/t187ap45_L" -o dividends.json

      - name: Download US market data
        run: |
          python - <<'PY'
          import json, urllib.request, time
          symbols=["AAPL","VOO","TSM","UUUU","NTSD","TSLA","VTI","VT","NVDA","SPY","GOOGL"]
          out=[]
          for s in symbols:
              url=f"https://query1.finance.yahoo.com/v8/finance/chart/{s}?range=1d&interval=1d"
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  d=json.load(urllib.request.urlopen(req,timeout=20))
                  meta=d["chart"]["result"][0].get("meta",{})
                  price=meta.get("regularMarketPrice")
                  if price is not None:
                      out.append({"symbol":s,"price":price})
              except Exception as e:
                  print("US",s,"failed:",e)
              time.sleep(0.2)
          json.dump(out,open("us_market.json","w"),ensure_ascii=False,indent=2)
          print(out)
          PY

      - name: Download USD/TWD
        run: |
          python - <<'PY'
          import json, urllib.request
          url="https://open.er-api.com/v6/latest/USD"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          d=json.load(urllib.request.urlopen(req,timeout=20))
          rate=d["rates"]["TWD"]
          json.dump({"USD_TWD":rate},open("fx.json","w"),ensure_ascii=False,indent=2)
          print("USD/TWD",rate)
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json dividends.json us_market.json fx.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push
