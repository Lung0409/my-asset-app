name: Update Taiwan Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download TWSE data
        run: |
          curl -L --fail --retry 3 "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL" -o market.json
          curl -L --fail --retry 3 "https://openapi.twse.com.tw/v1/opendata/t187ap45_L" -o dividends.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json dividends.json
          git diff --cached --quiet || git commit -m "Update TWSE market data"
          git push
